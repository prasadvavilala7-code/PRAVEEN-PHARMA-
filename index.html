<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRAVEEN PHARMA | Wholesale Medicine Supply</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#203447;background:#f4f8fb;line-height:1.6}
header{padding:42px 16px;text-align:center;color:#fff;background:linear-gradient(120deg,#062b49,#07558c,#078b91)}
header h1{margin:0;font-size:clamp(28px,5vw,42px);letter-spacing:1px}header p{margin:8px 0 0}
main{max-width:900px;margin:28px auto;padding:0 16px}.panel{background:#fff;border:1px solid #dce7ee;border-radius:16px;padding:24px;margin:18px 0;box-shadow:0 5px 18px #12334a10}

.call{display:block;padding:16px;border-radius:10px;text-align:center;text-decoration:none;background:#087b67;color:#fff;font-weight:bold}
footer{text-align:center;padding:22px;background:#062b49;color:#fff;margin-top:35px}

</style></head>
<body>
<header><h1 id="businessName">PRAVEEN PHARMA</h1><p id="tagline">Wholesale Medicine Supply</p><p id="addressHeader">Opposite Union Bank, Sircilla, Telangana</p></header>
<main>
<section class="panel" id="announcementPanel" hidden><h2>Announcement</h2><p id="announcement"></p></section>
<section class="panel"><h2>About Us</h2><p id="aboutText">Wholesale medicine supply in Sircilla.</p></section>

</main><footer>© <span id="footerName">PRAVEEN PHARMA</span></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=window.supabase.createClient("https://hdoftqemjttaegkysjyq.supabase.co","sb_publishable_75Bn2frOUV-LeTqXvgUVtg__jIxuA72");
const byId=id=>document.getElementById(id);
function setPhone(id,number){const digits=String(number||"").replace(/[^0-9+]/g,"");const link=byId(id);link.href=digits?"tel:"+digits:"#";link.textContent=digits?"Call "+String(number):"Phone number not available";link.hidden=!digits;}
async function loadPublicSettings(){
 const {data,error}=await db.from("site_settings").select("business_name,tagline,about_text,address,phone_primary,phone_secondary,announcement").eq("id",1).maybeSingle();
 if(error||!data)return;
 const name=data.business_name||"PRAVEEN PHARMA";
 byId("businessName").textContent=name;byId("footerName").textContent=name;
 byId("tagline").textContent=data.tagline||"";byId("aboutText").textContent=data.about_text||"";
 byId("addressHeader").textContent=data.address||"";byId("addressText").textContent=data.address||"";
 setPhone("phonePrimary",data.phone_primary);setPhone("phoneSecondary",data.phone_secondary);
 const announcement=String(data.announcement||"").trim();
 byId("announcement").textContent=announcement;byId("announcementPanel").hidden=!announcement;
 document.title=name+" | "+(data.tagline||"Wholesale Medicine Supply");
}
loadPublicSettings();
</script></body></html>
