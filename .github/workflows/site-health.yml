name: PRAVEEN PHARMA website health checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess, tempfile

          class ScriptExtractor(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_script = False
                  self.external = False
                  self.parts = []
                  self.scripts = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      attrs = dict(attrs)
                      self.in_script = True
                      self.external = bool(attrs.get("src"))
                      self.parts = []
              def handle_data(self, data):
                  if self.in_script and not self.external:
                      self.parts.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.in_script:
                      if not self.external and "".join(self.parts).strip():
                          self.scripts.append("".join(self.parts))
                      self.in_script = False
                      self.external = False

          failed = False
          for filename in ["index.html", "admin.html", "retailer.html"]:
              parser = ScriptExtractor()
              parser.feed(Path(filename).read_text(encoding="utf-8"))
              print(f"{filename}: found {len(parser.scripts)} inline script(s)")
              for i, script in enumerate(parser.scripts, 1):
                  with tempfile.NamedTemporaryFile("w", suffix=".js", encoding="utf-8") as f:
                      f.write(script)
                      f.flush()
                      result = subprocess.run(["node", "--check", f.name], capture_output=True, text=True)
                  if result.returncode:
                      failed = True
                      print(f"FAIL: {filename} inline script {i}")
                      print(result.stderr)
          if failed:
              raise SystemExit(1)
          print("All inline JavaScript syntax checks passed.")
          PY
      - name: Run security smoke checks
        run: python3 scripts/security-smoke-check.py
      - name: Check live public website
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 30 "https://prasadvavilala7-code.github.io/PRAVEEN-PHARMA-/" -o /tmp/main.html
          grep -qi "PRAVEEN" /tmp/main.html
      - name: Check live admin panel
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 30 "https://prasadvavilala7-code.github.io/PRAVEEN-PHARMA-/admin.html" -o /tmp/admin.html
          grep -qi "PRAVEEN" /tmp/admin.html
      - name: Check live retailer portal
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 30 "https://prasadvavilala7-code.github.io/PRAVEEN-PHARMA-/retailer.html" -o /tmp/retailer.html
          grep -qi "PRAVEEN" /tmp/retailer.html
      - name: Save diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: website-health-diagnostics
          path: |
            /tmp/main.html
            /tmp/admin.html
            /tmp/retailer.html
          if-no-files-found: ignore
